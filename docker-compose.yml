services:

  app:
    build: .
    container_name: pingo-decor-app
    working_dir: /var/www
    user: "1000:1000"
    volumes:
      - ./src:/var/www

  nginx:
    image: nginx:latest
    container_name: pingo-decor-nginx
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: pingo-decor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pingo-decor
      MYSQL_USER: larave
      MYSQL_PASSWORD: larave
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pingo-decor-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
    - mysql


volumes:
  mysql_data: